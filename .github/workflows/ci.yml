name: Phoenix Test Automation Framework

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule: #set the crone for midnight ist-utc
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      env:
       description: "environment"
       type: choice
       options:
        - qa
        - uat
        - dev
       default: qa
       required: true
     suiteXmlFiles:
      description: "Testng xml file"
      type: choice
      options:
        - testng.xml
        - smoke.xml
        - regression.xml
       default: testng.xml
       required: true
    
        
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Execute Test Automation Framework
      run: mvn test -Dsurefire.suiteXmlFiles=${{ github.event.inputs.suiteXmlFiles }}  -Denv=${{ github.event.inputs.env }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      if:   always()
      with:
        name: Surefire Report
        path: target/surefire-reports/
        retention-days: 10

   
